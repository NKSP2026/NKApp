<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benutzerverwaltung - NKSP</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#111;
      color:white;
      padding:20px;
      min-height:100vh;
    }

    h1{
      text-align:center;
      font-size:42px;
      margin-bottom:30px;
    }

    .top-bar{
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
      margin-bottom:30px;
    }

    .admin-btn{
      background:#2563eb;
      color:white;
      border:none;
      padding:14px 22px;
      border-radius:12px;
      cursor:pointer;
      font-size:16px;
      font-weight:bold;
      text-decoration:none;
    }

    .admin-btn:hover{
      background:#1d4ed8;
    }

    .container{
      max-width:1100px;
      margin:auto;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:20px;
    }

    .card{
      background:#1c1c1f;
      border-radius:20px;
      padding:20px;
      position:relative;
      border:1px solid #2f2f35;
    }

    .status{
      position:absolute;
      top:20px;
      right:20px;
      width:14px;
      height:14px;
      border-radius:50%;
      background:#ef4444;
      box-shadow:0 0 10px rgba(239,68,68,0.7);
    }

    .status.online{
      background:#22c55e;
      box-shadow:0 0 10px rgba(34,197,94,0.7);
    }

    .card h2{
      font-size:24px;
      margin-bottom:15px;
      padding-right:25px;
    }

    .card p{
      color:#ccc;
      margin-bottom:10px;
      line-height:1.5;
      word-break:break-word;
    }

    .rolle{
      display:inline-block;
      margin-top:10px;
      padding:10px 14px;
      border-radius:10px;
      font-size:14px;
      font-weight:bold;
      cursor:pointer;
      border:none;
      color:white;
    }

    .rolle.admin{
      background:#dc2626;
    }

    .rolle.mitarbeiter{
      background:#2563eb;
    }

    .leer{
      text-align:center;
      color:#888;
      margin-top:40px;
      font-size:18px;
    }

    @media(max-width:700px){

      h1{
        font-size:32px;
      }

    }
  </style>
</head>

<body>

  <h1>Benutzerverwaltung</h1>

  <div class="top-bar">
    <a href="startseite.html" class="admin-btn">Zurück</a>
  </div>

  <div class="container" id="container"></div>
  <div class="leer" id="leer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";

import {
  getAuth,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  onValue,
  update,
  push
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

import {
  getMessaging,
  getToken,
  onMessage
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyBiKHmV0HEBB2Gr74VOgbosxRGs9MDa7uQ",
  authDomain: "nksp-app.firebaseapp.com",
  databaseURL: "https://nksp-app-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "nksp-app",
  storageBucket: "nksp-app.firebasestorage.app",
  messagingSenderId: "328702502215",
  appId: "1:328702502215:web:080148f3e768bfafc29862"
};

const VAPID_KEY =
  "BE-rnRFY8xtS5q9n0AbahJO6vKzHTx0qJWswxniLPEOT9vv151eaJEbaYwrRd-r1ijlEb7L5dwrKSa2e7hHKAaE";

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getDatabase(app);
const messaging = getMessaging(app);

/* PUSH BENACHRICHTIGUNGEN */
async function pushAktivieren(userUid){

  try{

    const permission =
      await Notification.requestPermission();

    if(permission !== "granted"){

      console.log("Benachrichtigungen nicht erlaubt");

      return;
    }

    const registration =
      await navigator.serviceWorker.register(
        "/firebase-messaging-sw.js"
      );

    const token = await getToken(
      messaging,
      {
        vapidKey: VAPID_KEY,
        serviceWorkerRegistration: registration
      }
    );

    if(!token){

      console.log("Kein FCM Token erhalten");

      return;
    }

    console.log("FCM Token:", token);

    const benutzerRef = ref(db, "benutzer");

    onValue(
      benutzerRef,

      async (snapshot) => {

        snapshot.forEach(async (child) => {

          const daten = child.val();

          if(daten.uid === userUid){

            await update(
              ref(db, "benutzer/" + child.key),
              {
                fcmToken: token
              }
            );

            await push(
              ref(db, "pushSubscriptions"),
              {
                uid: userUid,
                token: token,
                erstelltAm: Date.now()
              }
            );

          }

        });

      },

      {
        onlyOnce:true
      }

    );

  }catch(error){

    console.error("Push Fehler:", error);

  }

}

/* APP OFFEN */
onMessage(messaging, (payload) => {

  console.log(
    "Foreground Nachricht:",
    payload
  );

  if(payload.notification){

    alert(
      payload.notification.title +
      "\n\n" +
      payload.notification.body
    );

  }

});

/* LOGIN */
onAuthStateChanged(auth, async (user) => {

  if(!user){

    window.location.href = "index.html";

    return;
  }

  pushAktivieren(user.uid);

  const benutzerRef = ref(db, "benutzer");

  /* LIVE ROLLEN ÜBERWACHUNG */
  onValue(benutzerRef, (snapshot) => {

    let istAdmin = false;

    snapshot.forEach((child) => {

      const daten = child.val();

      if(daten.uid === user.uid){

        if(daten.rolle === "admin"){
          istAdmin = true;
        }

      }

    });

    /* ADMIN BUTTONS */
    document.getElementById(
      "adminBereichBtn"
    ).style.display =
      istAdmin ? "flex" : "none";

    document.getElementById(
      "benachrichtigungenBtn"
    ).style.display =
      istAdmin ? "flex" : "none";

    document.getElementById(
      "papierkorbBtn"
    ).style.display =
      istAdmin ? "flex" : "none";

  });

  /* EINMAL ONLINE SETZEN */
  const snapshot = await new Promise((resolve) => {

    onValue(
      benutzerRef,

      (snap) => {
        resolve(snap);
      },

      {
        onlyOnce:true
      }

    );

  });

  snapshot.forEach(async (child) => {

    const daten = child.val();

    if(daten.uid === user.uid){

      await update(
        ref(db, "benutzer/" + child.key),
        {
          online:true,
          letzteAktivitaet:
            new Date().toISOString()
        }
      );

    }

  });

});

/* TAB SCHLIESSEN */
window.addEventListener(
  "beforeunload",

  async () => {

    try{

      const user = auth.currentUser;

      if(!user) return;

      const benutzerRef =
        ref(db, "benutzer");

      onValue(
        benutzerRef,

        async (snapshot) => {

          snapshot.forEach(async (child) => {

            const daten = child.val();

            if(daten.uid === user.uid){

              await update(
                ref(
                  db,
                  "benutzer/" + child.key
                ),
                {
                  online:false,
                  letzteAktivitaet:
                    new Date().toISOString()
                }
              );

            }

          });

        },

        {
          onlyOnce:true
        }

      );

    }catch(error){

      console.error(error);

    }

  }

);

/* LOGOUT */
window.logout = async function(){

  try{

    const user = auth.currentUser;

    if(user){

      const benutzerRef =
        ref(db, "benutzer");

      await new Promise((resolve) => {

        onValue(

          benutzerRef,

          async (snapshot) => {

            const updates = [];

            snapshot.forEach((child) => {

              const daten = child.val();

              if(daten.uid === user.uid){

                updates.push(

                  update(
                    ref(
                      db,
                      "benutzer/" + child.key
                    ),
                    {
                      online:false,
                      letzteAktivitaet:
                        new Date().toISOString()
                    }
                  )

                );

              }

            });

            await Promise.all(updates);

            resolve();

          },

          {
            onlyOnce:true
          }

        );

      });

    }

    await signOut(auth);

    window.location.href = "index.html";

  }catch(error){

    console.error(error);

    alert("Fehler beim Logout");

  }

};
</script>
