<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benutzerverwaltung - NKSP</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#111;
  color:white;
  padding:20px;
  min-height:100vh;
}

h1{
  text-align:center;
  font-size:42px;
  margin-bottom:30px;
}

/* TOP */
.top-bar{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:30px;
}

/* 3D BUTTON */
.admin-btn{
  position:relative;
  overflow:hidden;

  background:linear-gradient(
    180deg,
    #3b82f6 0%,
    #2563eb 45%,
    #1d4ed8 100%
  );

  color:white;
  border:none;
  border-radius:18px;
  padding:14px 24px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  text-decoration:none;

  box-shadow:
    0 8px 0 #1e40af,
    0 14px 22px rgba(0,0,0,0.45),
    inset 0 2px 0 rgba(255,255,255,0.25);

  transition:0.15s;
}

.admin-btn:hover{
  transform:translateY(-2px);

  box-shadow:
    0 10px 0 #1e40af,
    0 18px 28px rgba(0,0,0,0.55),
    inset 0 2px 0 rgba(255,255,255,0.3);
}

.admin-btn:active{
  transform:translateY(6px);

  box-shadow:
    0 2px 0 #1e40af,
    0 5px 12px rgba(0,0,0,0.35);
}

/* GRID */
.container{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:20px;
}

/* CARD */
.card{
  background:#1c1c1f;
  border-radius:22px;
  padding:22px;
  position:relative;
  border:1px solid #2f2f35;

  box-shadow:
    0 12px 25px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.04);
}

/* STATUS */
.status{
  position:absolute;
  top:20px;
  right:20px;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#ef4444;
  box-shadow:0 0 10px rgba(239,68,68,0.7);
}

.status.online{
  background:#22c55e;
  box-shadow:0 0 10px rgba(34,197,94,0.7);
}

.card h2{
  font-size:24px;
  margin-bottom:15px;
  padding-right:25px;
}

.card p{
  color:#ccc;
  margin-bottom:10px;
  line-height:1.5;
  word-break:break-word;
}

/* ROLLEN BUTTON */
.rolle-btn{
  position:relative;
  overflow:hidden;

  margin-top:15px;

  border:none;
  cursor:pointer;

  padding:12px 18px;

  border-radius:14px;

  font-size:15px;
  font-weight:bold;
  color:white;

  transition:0.15s;

  box-shadow:
    0 6px 0 rgba(0,0,0,0.35),
    0 12px 18px rgba(0,0,0,0.35);
}

.rolle-btn.admin{
  background:linear-gradient(
    180deg,
    #ef4444 0%,
    #dc2626 45%,
    #991b1b 100%
  );
}

.rolle-btn.mitarbeiter{
  background:linear-gradient(
    180deg,
    #3b82f6 0%,
    #2563eb 45%,
    #1d4ed8 100%
  );
}

.rolle-btn:hover{
  transform:translateY(-2px);
}

.rolle-btn:active{
  transform:translateY(5px);

  box-shadow:
    0 2px 0 rgba(0,0,0,0.35),
    0 5px 10px rgba(0,0,0,0.3);
}

.leer{
  text-align:center;
  color:#888;
  margin-top:40px;
  font-size:18px;
}

@media(max-width:700px){

  h1{
    font-size:32px;
  }

}

</style>
</head>

<body>

<h1>Benutzerverwaltung</h1>

<div class="top-bar">
  <a href="startseite.html" class="admin-btn">
    Zurück
  </a>
</div>

<div class="container" id="container"></div>
<div class="leer" id="leer"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  onValue,
  update
}
from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBiKHmV0HEBB2Gr74VOgbosxRGs9MDa7uQ",
  authDomain: "nksp-app.firebaseapp.com",
  databaseURL: "https://nksp-app-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "nksp-app",
  storageBucket: "nksp-app.firebasestorage.app",
  messagingSenderId: "328702502215",
  appId: "1:328702502215:web:080148f3e768bfafc29862"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getDatabase(app);

const benutzerRef = ref(db, "benutzer");

let alleBenutzer = [];
let eigenerEintragKey = "";

/* LOGIN */
onAuthStateChanged(auth, (user) => {

  if(!user){

    window.location.href = "index.html";
    return;

  }

  onValue(benutzerRef, async (snapshot) => {

    alleBenutzer = [];

    let aktuellerDatensatz = null;

    snapshot.forEach((child) => {

      const daten = {
        id: child.key,
        ...child.val()
      };

      alleBenutzer.push(daten);

      if(daten.uid === user.uid){

        aktuellerDatensatz = daten;
        eigenerEintragKey = child.key;

      }

    });

    /* NUR ADMIN */
    if(!aktuellerDatensatz ||
       aktuellerDatensatz.rolle !== "admin"){

      alert("Nur Admins dürfen diese Seite öffnen");

      window.location.href = "startseite.html";

      return;

    }

    /* ONLINE */
    if(eigenerEintragKey){

      await update(
        ref(db, "benutzer/" + eigenerEintragKey),
        {
          online:true,
          letzteAktivitaet:
            new Date().toISOString()
        }
      );

    }

    render();

  });

});

/* OFFLINE */
window.addEventListener(
  "beforeunload",
  async () => {

    if(!eigenerEintragKey) return;

    try{

      await update(
        ref(db, "benutzer/" + eigenerEintragKey),
        {
          online:false,
          letzteAktivitaet:
            new Date().toISOString()
        }
      );

    }catch(error){

      console.error(error);

    }

  }
);

/* RENDER */
function render(){

  const container =
    document.getElementById("container");

  const leer =
    document.getElementById("leer");

  container.innerHTML = "";

  if(alleBenutzer.length === 0){

    leer.innerText =
      "Keine Benutzer gefunden";

    return;

  }

  leer.innerText = "";

  alleBenutzer.forEach((user) => {

    container.innerHTML += `

      <div class="card">

        <div class="status ${user.online ? "online" : ""}"></div>

        <h2>
          ${user.vorname || ""}
          ${user.nachname || ""}
        </h2>

        <p>
          <strong>E-Mail:</strong>
          ${user.email || "-"}
        </p>

        <p>
          <strong>Status:</strong>
          ${user.online ? "Online" : "Offline"}
        </p>

        <button
          class="rolle-btn ${user.rolle}"
          onclick="rolleAendern('${user.id}','${user.rolle}')"
        >
          ${user.rolle}
        </button>

      </div>

    `;

  });

}

/* ROLLE ÄNDERN */
window.rolleAendern =
async function(id, aktuelleRolle){

  const neueRolle =
    aktuelleRolle === "admin"
    ? "mitarbeiter"
    : "admin";

  const ok = confirm(
    "Rolle ändern zu: " + neueRolle + " ?"
  );

  if(!ok) return;

  try{

    /* ADMIN RECHTE */
    let rechte = {};

    if(neueRolle === "admin"){

      rechte = {

        mitarbeiter_lesen:true,
        mitarbeiter_hinzufuegen:true,

        dienste_hinzufuegen:true,

        dokumente_download:true,
        dokumente_hinzufuegen:true,

        dienstberichte_upload:true

      };

    }else{

      rechte = {

        mitarbeiter_lesen:true,
        mitarbeiter_hinzufuegen:false,

        dienste_hinzufuegen:false,

        dokumente_download:true,
        dokumente_hinzufuegen:false,

        dienstberichte_upload:true

      };

    }

    await update(
      ref(db, "benutzer/" + id),
      {
        rolle: neueRolle,
        rechte: rechte
      }
    );

    alert(
      "Rolle geändert zu: " +
      neueRolle
    );

  }catch(error){

    console.error(error);

    alert("Fehler beim Ändern");

  }

};

</script>

</body>
</html>
