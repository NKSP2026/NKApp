<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dienst- & Verdienstrechner FINAL</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    background:#1e293b;
    padding:20px;
    border-radius:15px;
}

.topbox{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

.topbox label{
    font-size:20px;
    font-weight:bold;
}

.topbox input{
    margin-top:10px;
    max-width:250px;
}

.monat{
    background:#1e293b;
    margin-top:25px;
    padding:20px;
    border-radius:15px;
}

.monat h2{
    background:#1d4ed8;
    padding:14px;
    border-radius:12px;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
    min-width:1350px;
}

th{
    background:#111827;
    padding:12px;
    font-size:18px;
}

td{
    border:1px solid #334155;
    padding:10px;
    text-align:center;
}

input, select{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#e2e8f0;
    color:black;
    font-size:16px;
}

.veranstaltung{
    min-width:260px;
}

.ort{
    min-width:220px;
}

.zusammenfassung{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-top:20px;
}

.box{
    flex:1;
    min-width:220px;
    background:#334155;
    padding:18px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
}

#jahresbilanz{
    margin-top:40px;
    background:#1e293b;
    padding:25px;
    border-radius:15px;
}

.buttons{
    margin-top:20px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

button{
    padding:14px 20px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.save{
    background:#22c55e;
    color:white;
}

.delete{
    background:#ef4444;
    color:white;
}

.export{
    background:#3b82f6;
    color:white;
}

@media(max-width:1200px){

    body{
        padding:10px;
    }

    table{
        min-width:1450px;
    }
}

</style>
</head>

<body>

<h1>Dienst- & Verdienstrechner FINAL 2026</h1>

<div class="topbox">

    <label>Stundenlohn (€)</label><br>

    <input type="number" id="stundenlohn" value="15" step="0.01">

</div>

<div class="buttons">
    <button class="save" onclick="manuellSpeichern()">💾 Jetzt speichern</button>
    <button class="delete" onclick="allesLoeschen()">🗑 Alles löschen</button>
    <button class="export" onclick="datenExportieren()">📁 Daten exportieren</button>
</div>

<div id="app"></div>

<div id="jahresbilanz">

    <h2>Jahreszusammenfassung</h2>

    <div class="zusammenfassung">

        <div class="box">
            Gesamt Dienste:<br><br>
            <span id="jahrDienste">0</span>
        </div>

        <div class="box">
            Gesamt Stunden:<br><br>
            <span id="jahrStunden">0.00</span>
        </div>

        <div class="box">
            Gesamt Verdienst:<br><br>
            <span id="jahrGeld">0.00 €</span>
        </div>

    </div>

</div>

<script>

const monate = [
"Januar","Februar","März","April","Mai","Juni",
"Juli","August","September","Oktober","November","Dezember"
];

const app = document.getElementById("app");

monate.forEach(monat => {

    let html = `
    <div class="monat">

        <h2>${monat}</h2>

        <div class="table-wrapper">

        <table>

            <thead>

                <tr>
                    <th>Dienst</th>
                    <th>Einsatzart</th>
                    <th>Veranstaltung</th>
                    <th>Ort</th>
                    <th>Datum</th>
                    <th>Von</th>
                    <th>Bis</th>
                    <th>Stunden</th>
                    <th>Verdienst</th>
                </tr>

            </thead>

            <tbody>
    `;

    for(let i=1;i<=6;i++){

        html += `
        <tr>

            <td>${i}</td>

            <td>
                <select class="art">
                    <option>Sicherheitsdienst</option>
                    <option>Feuerwehr</option>
                    <option>Veranstaltung</option>
                    <option>Wachdienst</option>
                    <option>Sonstiges</option>
                </select>
            </td>

            <td>
                <input type="text"
                class="veranstaltung"
                placeholder="z.B. Konzert">
            </td>

            <td>
                <input type="text"
                class="ort"
                placeholder="z.B. Leipzig">
            </td>

            <td>
                <input type="date" class="datum">
            </td>

            <td>
                <input type="time" class="von">
            </td>

            <td>
                <input type="time" class="bis">
            </td>

            <td class="stunden">0.00</td>

            <td class="verdienst">0.00 €</td>

        </tr>
        `;
    }

    html += `
            </tbody>

        </table>

        </div>

        <div class="zusammenfassung">

            <div class="box">
                Dienste:<br><br>
                <span class="diensteGesamt">0</span>
            </div>

            <div class="box">
                Stunden:<br><br>
                <span class="stundenGesamt">0.00</span>
            </div>

            <div class="box">
                Verdienst:<br><br>
                <span class="geldGesamt">0.00 €</span>
            </div>

        </div>

    </div>
    `;

    app.innerHTML += html;
});

function berechnen(){

    let jahrDienste = 0;
    let jahrStunden = 0;
    let jahrGeld = 0;

    const stundenlohn =
        parseFloat(document.getElementById("stundenlohn").value) || 0;

    document.querySelectorAll(".monat").forEach(monat => {

        let dienstCount = 0;
        let stundenGesamt = 0;
        let geldGesamt = 0;

        monat.querySelectorAll("tbody tr").forEach(row => {

            const von = row.querySelector(".von").value;
            const bis = row.querySelector(".bis").value;

            let stunden = 0;

            if(von && bis){

                let start = new Date("2026-01-01T" + von);
                let ende = new Date("2026-01-01T" + bis);

                stunden = (ende - start) / 1000 / 60 / 60;

                if(stunden < 0){
                    stunden += 24;
                }

                dienstCount++;
            }

            const geld = stunden * stundenlohn;

            row.querySelector(".stunden").innerText = stunden.toFixed(2);
            row.querySelector(".verdienst").innerText = geld.toFixed(2) + " €";

            stundenGesamt += stunden;
            geldGesamt += geld;
        });

        monat.querySelector(".diensteGesamt").innerText = dienstCount;
        monat.querySelector(".stundenGesamt").innerText = stundenGesamt.toFixed(2);
        monat.querySelector(".geldGesamt").innerText = geldGesamt.toFixed(2) + " €";

        jahrDienste += dienstCount;
        jahrStunden += stundenGesamt;
        jahrGeld += geldGesamt;
    });

    document.getElementById("jahrDienste").innerText = jahrDienste;
    document.getElementById("jahrStunden").innerText = jahrStunden.toFixed(2);
    document.getElementById("jahrGeld").innerText = jahrGeld.toFixed(2) + " €";

    speichern();
}

function speichern(){

    const daten = [];

    document.querySelectorAll(".monat").forEach(monat => {

        const monatDaten = [];

        monat.querySelectorAll("tbody tr").forEach(row => {

            monatDaten.push({

                art: row.querySelector(".art").value,
                veranstaltung: row.querySelector(".veranstaltung").value,
                ort: row.querySelector(".ort").value,
                datum: row.querySelector(".datum").value,
                von: row.querySelector(".von").value,
                bis: row.querySelector(".bis").value

            });

        });

        daten.push(monatDaten);
    });

    localStorage.setItem("dienstplan2026final", JSON.stringify({

        daten,
        stundenlohn: document.getElementById("stundenlohn").value

    }));
}

function laden(){

    const datenGesamt = JSON.parse(
        localStorage.getItem("dienstplan2026final")
    );

    if(!datenGesamt) return;

    document.getElementById("stundenlohn").value =
        datenGesamt.stundenlohn || 15;

    const daten = datenGesamt.daten;

    document.querySelectorAll(".monat").forEach((monat, monatIndex) => {

        monat.querySelectorAll("tbody tr").forEach((row, rowIndex) => {

            const datenRow = daten[monatIndex][rowIndex];

            if(datenRow){

                row.querySelector(".art").value = datenRow.art || "";
                row.querySelector(".veranstaltung").value = datenRow.veranstaltung || "";
                row.querySelector(".ort").value = datenRow.ort || "";
                row.querySelector(".datum").value = datenRow.datum || "";
                row.querySelector(".von").value = datenRow.von || "";
                row.querySelector(".bis").value = datenRow.bis || "";
            }
        });
    });

    berechnen();
}

function allesLoeschen(){

    if(confirm("Wirklich alle Daten löschen?")){

        localStorage.removeItem("dienstplan2026final");
        location.reload();
    }
}

function manuellSpeichern(){

    speichern();
    alert("Daten gespeichert!");
}

function datenExportieren(){

    const daten = localStorage.getItem("dienstplan2026final");

    const blob = new Blob([daten], {type:"application/json"});

    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);
    a.download = "dienstplan_backup_2026.json";
    a.click();
}

document.querySelectorAll("input, select").forEach(input => {
    input.addEventListener("input", berechnen);
});

laden();
berechnen();

</script>

</body>
</html>
