<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NKSP Gehaltsrechner 2026</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    padding:15px;
    overflow-x:hidden;
    position:relative;
}

/* WASSERZEICHEN */
body::before{
    content:"";
    position:fixed;
    inset:0;

    background-image:url("icon-512.png");
    background-repeat:repeat;
    background-size:220px;

    opacity:0.03;

    filter:
      grayscale(100%)
      brightness(200%);

    pointer-events:none;
    z-index:0;
}

body > *{
    position:relative;
    z-index:1;
}

h1{
    text-align:center;
    background:#1e293b;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
    font-size:34px;
}

.topbox{
    background:#1e293b;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
}

.topbox label{
    font-size:20px;
    font-weight:bold;
}

.topbox input{
    margin-top:10px;
    max-width:220px;
}

.buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

button{
    border:none;
    border-radius:14px;
    padding:16px 20px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    color:white;
}

.save{
    background:#22c55e;
}

.delete{
    background:#ef4444;
}

.export{
    background:#2563eb;
}

.month-button{
    width:100%;
    background:#1d4ed8;
    margin-bottom:14px;
    text-align:left;
    font-size:22px;
    border-radius:18px;
    padding:18px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.month-button:hover{
    background:#1e40af;
}

.monat{
    display:none;
    background:#1e293b;
    border-radius:18px;
    padding:18px;
    margin-bottom:25px;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1100px;
    border-collapse:collapse;
    margin-top:15px;
}

th{
    background:#111827;
    padding:12px;
    font-size:16px;
}

td{
    border:1px solid #334155;
    padding:10px;
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#e2e8f0;
    color:black;
    font-size:15px;
}

.add-row{
    background:#f59e0b;
    width:100%;
    margin-top:15px;
}

.monat-save{
    width:100%;
    margin-top:12px;
}

.zusammenfassung{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-top:20px;
}

.box{
    flex:1;
    min-width:220px;
    background:#334155;
    border-radius:15px;
    padding:18px;
    font-size:18px;
    font-weight:bold;
}

#jahresbilanz{
    background:#1e293b;
    border-radius:20px;
    padding:25px;
    margin-top:30px;
}

#jahresbilanz h2{
    margin-bottom:20px;
}

@media(max-width:768px){

    body{
        padding:10px;
    }

    h1{
        font-size:25px;
        padding:16px;
    }

    button{
        width:100%;
    }

    .month-button{
        font-size:18px;
        padding:15px;
    }

    .box{
        min-width:100%;
    }

    table{
        min-width:950px;
    }

}

</style>
</head>

<body>

<h1>NKSP Gehaltsrechner 2026</h1>

<div class="topbox">

    <label>Stundenlohn (€)</label><br>

    <input
        type="number"
        id="stundenlohn"
        value="15"
        step="0.01"
    >

</div>

<div class="buttons">

    <button
        class="save"
        onclick="manuellSpeichern()"
    >
        💾 Jetzt speichern
    </button>

    <button
        class="delete"
        onclick="allesLoeschen()"
    >
        🗑 Neues Jahr starten
    </button>

    <button
        class="export"
        onclick="pdfExport()"
    >
        📄 Als PDF speichern
    </button>

</div>

<div id="app"></div>

<div id="jahresbilanz">

    <h2>Jahresübersicht</h2>

    <div class="zusammenfassung">

        <div class="box">
            Gesamt Dienste:<br><br>
            <span id="jahrDienste">0</span>
        </div>

        <div class="box">
            Gesamt Stunden:<br><br>
            <span id="jahrStunden">0.00</span>
        </div>

        <div class="box">
            Gesamt Verdienst:<br><br>
            <span id="jahrGeld">0.00 €</span>
        </div>

    </div>

</div>

<!-- VORSCHLÄGE -->
<datalist id="orteListe">
    <option value="Neue Welt Zwickau">
    <option value="Globus Zwickau">
    <option value="Weihnachtsmarkt">
    <option value="Stadtfest">
    <option value="Leipzig">
    <option value="Chemnitz">
</datalist>

<datalist id="veranstaltungenListe">
    <option value="Konzert">
    <option value="Festival">
    <option value="Weihnachtsmarkt">
    <option value="Fußballspiel">
    <option value="Veranstaltung">
</datalist>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const monate = [
"Januar",
"Februar",
"März",
"April",
"Mai",
"Juni",
"Juli",
"August",
"September",
"Oktober",
"November",
"Dezember"
];

const app =
document.getElementById("app");

/* MONATE ERSTELLEN */
monate.forEach((monat,index)=>{

    app.innerHTML += `

    <button
        class="month-button"
        onclick="toggleMonat(${index})"
    >
        <span>📅 ${monat}</span>
        <span>▼</span>
    </button>

    <div
        class="monat"
        id="monat${index}"
    >

        <div class="table-wrapper">

        <table>

            <thead>

                <tr>
                    <th>Dienst</th>
                    <th>Veranstaltung</th>
                    <th>Ort</th>
                    <th>Datum</th>
                    <th>Von</th>
                    <th>Bis</th>
                    <th>Stunden</th>
                    <th>Verdienst</th>
                </tr>

            </thead>

            <tbody id="tbody${index}">
            </tbody>

        </table>

        </div>

        <button
            class="add-row"
            onclick="zeileHinzufuegen(${index})"
        >
            ➕ Weitere Zeile hinzufügen
        </button>

        <button
            class="save monat-save"
            onclick="manuellSpeichern()"
        >
            💾 ${monat} speichern
        </button>

        <div class="zusammenfassung">

            <div class="box">
                Dienste:<br><br>
                <span class="diensteGesamt">0</span>
            </div>

            <div class="box">
                Stunden:<br><br>
                <span class="stundenGesamt">0.00</span>
            </div>

            <div class="box">
                Verdienst:<br><br>
                <span class="geldGesamt">0.00 €</span>
            </div>

        </div>

    </div>

    `;

});

/* MONAT ÖFFNEN */
function toggleMonat(index){

    const monat =
    document.getElementById(
        "monat"+index
    );

    if(monat.style.display==="block"){

        monat.style.display="none";

    }else{

        monat.style.display="block";

    }

}

/* ZEILE HTML */
function neueZeileHTML(nummer){

    return `

    <tr>

        <td>${nummer}</td>

        <td>

            <input
                type="text"
                class="veranstaltung"
                list="veranstaltungenListe"
                placeholder="Veranstaltung"
            >

        </td>

        <td>

            <input
                type="text"
                class="ort"
                list="orteListe"
                placeholder="Ort"
            >

        </td>

        <td>
            <input type="date" class="datum">
        </td>

        <td>
            <input type="time" class="von">
        </td>

        <td>
            <input type="time" class="bis">
        </td>

        <td class="stunden">
            0.00
        </td>

        <td class="verdienst">
            0.00 €
        </td>

    </tr>

    `;

}

/* ZEILE HINZUFÜGEN */
function zeileHinzufuegen(index){

    const tbody =
    document.getElementById(
        "tbody"+index
    );

    const nummer =
    tbody.querySelectorAll("tr")
    .length + 1;

    tbody.innerHTML +=
    neueZeileHTML(nummer);

    eventsNeu();

}

window.zeileHinzufuegen =
zeileHinzufuegen;

/* WICHTIG:
   JEDER MONAT BEKOMMT
   EINE STARTZEILE
*/
for(let i=0;i<12;i++){

    zeileHinzufuegen(i);

}

/* BERECHNEN */
function berechnen(){

    let jahrDienste = 0;
    let jahrStunden = 0;
    let jahrGeld = 0;

    const stundenlohn =
    parseFloat(
        document.getElementById(
            "stundenlohn"
        ).value
    ) || 0;

    document.querySelectorAll(".monat")
    .forEach(monat => {

        let dienstCount = 0;
        let stundenGesamt = 0;
        let geldGesamt = 0;

        monat.querySelectorAll("tbody tr")
        .forEach(row => {

            const von =
            row.querySelector(".von").value;

            const bis =
            row.querySelector(".bis").value;

            let stunden = 0;

            if(von && bis){

                let start =
                new Date(
                    "2026-01-01T"+von
                );

                let ende =
                new Date(
                    "2026-01-01T"+bis
                );

                stunden =
                (ende-start)
                /1000/60/60;

                if(stunden < 0){
                    stunden += 24;
                }

                dienstCount++;

            }

            const geld =
            stunden * stundenlohn;

            row.querySelector(".stunden")
            .innerText =
            stunden.toFixed(2);

            row.querySelector(".verdienst")
            .innerText =
            geld.toFixed(2)+" €";

            stundenGesamt += stunden;
            geldGesamt += geld;

        });

        monat.querySelector(".diensteGesamt")
        .innerText = dienstCount;

        monat.querySelector(".stundenGesamt")
        .innerText =
        stundenGesamt.toFixed(2);

        monat.querySelector(".geldGesamt")
        .innerText =
        geldGesamt.toFixed(2)+" €";

        jahrDienste += dienstCount;
        jahrStunden += stundenGesamt;
        jahrGeld += geldGesamt;

    });

    document.getElementById(
        "jahrDienste"
    ).innerText = jahrDienste;

    document.getElementById(
        "jahrStunden"
    ).innerText =
    jahrStunden.toFixed(2);

    document.getElementById(
        "jahrGeld"
    ).innerText =
    jahrGeld.toFixed(2)+" €";

    speichern();

}

/* SPEICHERN */
function speichern(){

    const daten = [];

    document.querySelectorAll(".monat")
    .forEach(monat => {

        const monatDaten = [];

        monat.querySelectorAll("tbody tr")
        .forEach(row => {

            monatDaten.push({

                veranstaltung:
                row.querySelector(".veranstaltung").value,

                ort:
                row.querySelector(".ort").value,

                datum:
                row.querySelector(".datum").value,

                von:
                row.querySelector(".von").value,

                bis:
                row.querySelector(".bis").value

            });

        });

        daten.push(monatDaten);

    });

    localStorage.setItem(
        "nksp_gehaltsrechner_2026",
        JSON.stringify({

            daten,

            stundenlohn:
            document.getElementById(
                "stundenlohn"
            ).value

        })
    );

}

/* LADEN */
function laden(){

    const datenGesamt =
    JSON.parse(
        localStorage.getItem(
            "nksp_gehaltsrechner_2026"
        )
    );

    if(!datenGesamt) return;

    document.getElementById(
        "stundenlohn"
    ).value =
    datenGesamt.stundenlohn || 15;

    document.querySelectorAll(".monat")
    .forEach((monat,monatIndex)=>{

        const tbody =
        monat.querySelector("tbody");

        tbody.innerHTML = "";

        const datenMonat =
        datenGesamt.daten[monatIndex];

        if(
            datenMonat &&
            datenMonat.length > 0
        ){

            datenMonat.forEach(
            (eintrag,rowIndex)=>{

                tbody.innerHTML +=
                neueZeileHTML(
                    rowIndex + 1
                );

            });

        }else{

            tbody.innerHTML +=
            neueZeileHTML(1);

        }

    });

    eventsNeu();

    document.querySelectorAll(".monat")
    .forEach((monat,monatIndex)=>{

        monat.querySelectorAll("tbody tr")
        .forEach((row,rowIndex)=>{

            const daten =
            datenGesamt
            .daten[monatIndex][rowIndex];

            if(!daten) return;

            row.querySelector(".veranstaltung")
            .value =
            daten.veranstaltung || "";

            row.querySelector(".ort")
            .value =
            daten.ort || "";

            row.querySelector(".datum")
            .value =
            daten.datum || "";

            row.querySelector(".von")
            .value =
            daten.von || "";

            row.querySelector(".bis")
            .value =
            daten.bis || "";

        });

    });

}

/* ALLES LÖSCHEN */
function allesLoeschen(){

    if(
        confirm(
            "Wirklich neues Jahr starten?"
        )
    ){

        localStorage.removeItem(
            "nksp_gehaltsrechner_2026"
        );

        location.reload();

    }

}

/* MANUELL */
function manuellSpeichern(){

    speichern();

    alert(
        "Daten gespeichert!"
    );

}

/* PDF */
async function pdfExport(){

    const { jsPDF } =
    window.jspdf;

    const pdf =
    new jsPDF();

    let y = 20;

    pdf.setFontSize(20);

    pdf.text(
        "NKSP Gehaltsrechner 2026",
        20,
        y
    );

    y += 20;

    monate.forEach((monat,index)=>{

        pdf.setFontSize(16);

        pdf.text(
            monat,
            20,
            y
        );

        y += 10;

        const rows =
        document.querySelectorAll(
            "#tbody"+index+" tr"
        );

        rows.forEach(row => {

            const veranstaltung =
            row.querySelector(
                ".veranstaltung"
            ).value;

            const ort =
            row.querySelector(
                ".ort"
            ).value;

            const datum =
            row.querySelector(
                ".datum"
            ).value;

            const stunden =
            row.querySelector(
                ".stunden"
            ).innerText;

            const geld =
            row.querySelector(
                ".verdienst"
            ).innerText;

            if(
                veranstaltung ||
                ort ||
                datum
            ){

                pdf.setFontSize(10);

                pdf.text(

                    `${veranstaltung} | ${ort} | ${datum} | ${stunden}h | ${geld}`,

                    20,
                    y

                );

                y += 7;

            }

            if(y > 270){

                pdf.addPage();

                y = 20;

            }

        });

        y += 10;

    });

    pdf.save(
        "NKSP_Gehaltsrechner_2026.pdf"
    );

}

/* EVENTS */
function eventsNeu(){

    document
    .querySelectorAll("input")
    .forEach(input => {

        input.removeEventListener(
            "input",
            berechnen
        );

        input.addEventListener(
            "input",
            berechnen
        );

    });

}

window.toggleMonat =
toggleMonat;

laden();

eventsNeu();

berechnen();

</script>

</body>
</html>
