<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NKSP Gehaltsrechner 2026</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    padding:15px;
}

/* WASSERZEICHEN */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:url("icon-512.png");
    background-repeat:repeat;
    background-size:260px;
    opacity:0.03;
    filter:grayscale(100%) brightness(220%);
    pointer-events:none;
    z-index:0;
}

body > *{
    position:relative;
    z-index:1;
}

h1{
    text-align:center;
    background:#1e293b;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
    font-size:32px;
}

.login-box,
.topbox,
#jahresbilanz{
    background:#1e293b;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
}

.login-box input,
.topbox input{
    margin-top:10px;
    margin-bottom:15px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:25px;
}

button{
    border:none;
    border-radius:12px;
    padding:14px 18px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    color:white;
}

.login-btn{
    background:#2563eb;
    width:100%;
    margin-top:10px;
}

.register-btn{
    background:#22c55e;
    width:100%;
    margin-top:10px;
}

.logout-btn{
    background:#ef4444;
    width:100%;
    margin-top:10px;
}

.save{
    background:#22c55e;
}

.delete{
    background:#ef4444;
}

.export{
    background:#2563eb;
}

.add-row{
    background:#f59e0b;
    width:100%;
    margin-top:15px;
}

.month-button{
    width:100%;
    background:#1d4ed8;
    margin-bottom:12px;
    text-align:left;
    font-size:20px;
    border-radius:16px;
    padding:18px;
}

.monat{
    display:none;
    background:#1e293b;
    border-radius:18px;
    padding:18px;
    margin-bottom:25px;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1200px;
    border-collapse:collapse;
    margin-top:15px;
}

th{
    background:#111827;
    padding:12px;
}

td{
    border:1px solid #334155;
    padding:10px;
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#e2e8f0;
    color:black;
    font-size:15px;
}

.zusammenfassung{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-top:20px;
}

.box{
    flex:1;
    min-width:200px;
    background:#334155;
    border-radius:15px;
    padding:18px;
    font-size:18px;
    font-weight:bold;
}

.hidden{
    display:none;
}

@media(max-width:768px){

    button{
        width:100%;
    }

    .box{
        min-width:100%;
    }

}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-box" id="loginBox">

    <h2>Login</h2><br>

    <input
        type="email"
        id="email"
        placeholder="E-Mail"
    >

    <input
        type="password"
        id="password"
        placeholder="Passwort"
    >

    <button
        class="login-btn"
        onclick="login()"
    >
        Einloggen
    </button>

    <button
        class="register-btn"
        onclick="register()"
    >
        Registrieren
    </button>

</div>

<!-- APP -->
<div id="appBereich" class="hidden">

<h1>NKSP Gehaltsrechner 2026</h1>

<button
    class="logout-btn"
    onclick="logout()"
>
    Logout
</button>

<br><br>

<div class="topbox">

    <label>Stundenlohn (€)</label><br><br>

    <input
        type="number"
        id="stundenlohn"
        value="15"
        step="0.01"
    >

</div>

<div class="buttons">

    <button
        class="save"
        onclick="manuellSpeichern()"
    >
        💾 Jetzt speichern
    </button>

    <button
        class="delete"
        onclick="allesLoeschen()"
    >
        🗑 Neues Jahr starten
    </button>

</div>

<div id="app"></div>

<div id="jahresbilanz">

    <h2>Jahresübersicht</h2>

    <div class="zusammenfassung">

        <div class="box">
            Dienste<br><br>
            <span id="jahrDienste">0</span>
        </div>

        <div class="box">
            Stunden<br><br>
            <span id="jahrStunden">0.00</span>
        </div>

        <div class="box">
            Verdienst<br><br>
            <span id="jahrGeld">0.00 €</span>
        </div>

    </div>

</div>

</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getDatabase,
    ref,
    set,
    get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE CONFIG */
/* HIER DEINE FIREBASE DATEN EINTRAGEN */

const firebaseConfig = {

    apiKey: "DEINE_APIKEY",

    authDomain:
    "DEINPROJEKT.firebaseapp.com",

    databaseURL:
    "https://DEINPROJEKT-default-rtdb.europe-west1.firebasedatabase.app",

    projectId: "DEINPROJEKT",

    storageBucket:
    "DEINPROJEKT.appspot.com",

    messagingSenderId:
    "123456789",

    appId:
    "DEINE_APP_ID"

};

const appFirebase =
initializeApp(firebaseConfig);

const auth =
getAuth(appFirebase);

const database =
getDatabase(appFirebase);

/* GLOBAL */
window.currentUser = null;

const monate = [
"Januar",
"Februar",
"März",
"April",
"Mai",
"Juni",
"Juli",
"August",
"September",
"Oktober",
"November",
"Dezember"
];

const app =
document.getElementById("app");

/* DATENLISTEN */
const datalistContainer =
document.createElement("div");

datalistContainer.innerHTML = `

<datalist id="orteListe">
<option value="Neue Welt Zwickau">
<option value="Globus Zwickau">
<option value="Weihnachtsmarkt">
<option value="Stadtfest">
<option value="Festival">
</datalist>

<datalist id="veranstaltungenListe">
<option value="Konzert">
<option value="Festival">
<option value="Fußball">
<option value="Messe">
<option value="Veranstaltung">
</datalist>

`;

document.body.appendChild(
datalistContainer
);

/* LOGIN */
window.login = async function(){

    const email =
    document.getElementById(
        "email"
    ).value;

    const password =
    document.getElementById(
        "password"
    ).value;

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }catch(error){

        alert(error.message);

    }

}

/* REGISTER */
window.register = async function(){

    const email =
    document.getElementById(
        "email"
    ).value;

    const password =
    document.getElementById(
        "password"
    ).value;

    try{

        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );

        alert(
            "Registrierung erfolgreich"
        );

    }catch(error){

        alert(error.message);

    }

}

/* LOGOUT */
window.logout = async function(){

    await signOut(auth);

}

/* USER LOGIN STATUS */
onAuthStateChanged(
auth,
async(user)=>{

    if(user){

        window.currentUser =
        user;

        document
        .getElementById(
            "loginBox"
        )
        .classList.add("hidden");

        document
        .getElementById(
            "appBereich"
        )
        .classList.remove("hidden");

        if(
            app.innerHTML === ""
        ){

            monate.forEach(
            (monat,index)=>{

                app.innerHTML += `

                <button
                    class="month-button"
                    onclick="toggleMonat(${index})"
                >
                    📅 ${monat}
                </button>

                <div
                    class="monat"
                    id="monat${index}"
                >

                    <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>
                                <th>Dienst</th>
                                <th>Veranstaltung</th>
                                <th>Ort</th>
                                <th>Datum</th>
                                <th>Von</th>
                                <th>Bis</th>
                                <th>Stunden</th>
                                <th>Verdienst</th>
                            </tr>

                        </thead>

                        <tbody
                            id="tbody${index}"
                        >
                        </tbody>

                    </table>

                    </div>

                    <button
                        class="add-row"
                        onclick="zeileHinzufuegen(${index})"
                    >
                        ➕ Zeile hinzufügen
                    </button>

                    <div class="zusammenfassung">

                        <div class="box">
                            Dienste<br><br>
                            <span class="diensteGesamt">
                            0
                            </span>
                        </div>

                        <div class="box">
                            Stunden<br><br>
                            <span class="stundenGesamt">
                            0.00
                            </span>
                        </div>

                        <div class="box">
                            Geld<br><br>
                            <span class="geldGesamt">
                            0.00 €
                            </span>
                        </div>

                    </div>

                </div>

                `;

            });

        }

        await laden();

    }else{

        window.currentUser =
        null;

        document
        .getElementById(
            "loginBox"
        )
        .classList.remove("hidden");

        document
        .getElementById(
            "appBereich"
        )
        .classList.add("hidden");

    }

});

/* MONAT */
window.toggleMonat =
function(index){

    const box =
    document.getElementById(
        "monat"+index
    );

    if(
        box.style.display ===
        "block"
    ){

        box.style.display =
        "none";

    }else{

        box.style.display =
        "block";

    }

}

/* ZEILE HTML */
function neueZeileHTML(nummer){

    return `

    <tr>

        <td>${nummer}</td>

        <td>
            <input
                type="text"
                class="veranstaltung"
                list="veranstaltungenListe"
            >
        </td>

        <td>
            <input
                type="text"
                class="ort"
                list="orteListe"
            >
        </td>

        <td>
            <input
                type="date"
                class="datum"
            >
        </td>

        <td>
            <input
                type="time"
                class="von"
            >
        </td>

        <td>
            <input
                type="time"
                class="bis"
            >
        </td>

        <td class="stunden">
            0.00
        </td>

        <td class="verdienst">
            0.00 €
        </td>

    </tr>

    `;

}

/* ZEILE */
window.zeileHinzufuegen =
function(monatIndex){

    const tbody =
    document.getElementById(
        "tbody"+monatIndex
    );

    const nummer =
    tbody.querySelectorAll("tr")
    .length + 1;

    tbody.insertAdjacentHTML(
        "beforeend",
        neueZeileHTML(nummer)
    );

    eventsNeu();

    berechnen();

}

/* EVENTS */
function eventsNeu(){

    document
    .querySelectorAll("input")
    .forEach(input=>{

        input.oninput =
        ()=>{

            berechnen();

        };

    });

}

/* BERECHNEN */
function berechnen(){

    let jahrDienste = 0;
    let jahrStunden = 0;
    let jahrGeld = 0;

    const stundenlohn =
    parseFloat(
        document.getElementById(
            "stundenlohn"
        ).value
    ) || 0;

    document
    .querySelectorAll(".monat")
    .forEach(monat=>{

        let dienste = 0;
        let stundenGesamt = 0;
        let geldGesamt = 0;

        monat
        .querySelectorAll("tbody tr")
        .forEach(row=>{

            const von =
            row.querySelector(".von")
            .value;

            const bis =
            row.querySelector(".bis")
            .value;

            let stunden = 0;

            if(von && bis){

                let start =
                new Date(
                    "2026-01-01T"+von
                );

                let ende =
                new Date(
                    "2026-01-01T"+bis
                );

                stunden =
                (ende-start)
                /1000/60/60;

                if(stunden < 0){
                    stunden += 24;
                }

                dienste++;

            }

            const geld =
            stunden * stundenlohn;

            row.querySelector(".stunden")
            .innerText =
            stunden.toFixed(2);

            row.querySelector(".verdienst")
            .innerText =
            geld.toFixed(2)
            +" €";

            stundenGesamt +=
            stunden;

            geldGesamt +=
            geld;

        });

        monat.querySelector(
        ".diensteGesamt"
        ).innerText =
        dienste;

        monat.querySelector(
        ".stundenGesamt"
        ).innerText =
        stundenGesamt.toFixed(2);

        monat.querySelector(
        ".geldGesamt"
        ).innerText =
        geldGesamt.toFixed(2)
        +" €";

        jahrDienste +=
        dienste;

        jahrStunden +=
        stundenGesamt;

        jahrGeld +=
        geldGesamt;

    });

    document.getElementById(
        "jahrDienste"
    ).innerText =
    jahrDienste;

    document.getElementById(
        "jahrStunden"
    ).innerText =
    jahrStunden.toFixed(2);

    document.getElementById(
        "jahrGeld"
    ).innerText =
    jahrGeld.toFixed(2)
    +" €";

}

/* SPEICHERN */
window.manuellSpeichern =
async function(){

    if(!window.currentUser)
    return;

    const daten = [];

    document
    .querySelectorAll(".monat")
    .forEach(monat=>{

        const monatDaten = [];

        monat
        .querySelectorAll("tbody tr")
        .forEach(row=>{

            monatDaten.push({

                veranstaltung:
                row.querySelector(
                ".veranstaltung"
                ).value,

                ort:
                row.querySelector(
                ".ort"
                ).value,

                datum:
                row.querySelector(
                ".datum"
                ).value,

                von:
                row.querySelector(
                ".von"
                ).value,

                bis:
                row.querySelector(
                ".bis"
                ).value

            });

        });

        daten.push(monatDaten);

    });

    await set(

        ref(
            database,
            "users/"
            +window.currentUser.uid
            +"/gehalt2026"
        ),

        {

            stundenlohn:
            document.getElementById(
                "stundenlohn"
            ).value,

            daten

        }

    );

    alert(
        "Gespeichert!"
    );

}

/* LADEN */
async function laden(){

    const snapshot =
    await get(

        ref(
            database,
            "users/"
            +window.currentUser.uid
            +"/gehalt2026"
        )

    );

    app.querySelectorAll(
    "tbody"
    ).forEach(t=>{

        t.innerHTML = "";

    });

    if(!snapshot.exists()){

        for(let i=0;i<12;i++){

            zeileHinzufuegen(i);

        }

        return;

    }

    const datenGesamt =
    snapshot.val();

    document.getElementById(
        "stundenlohn"
    ).value =
    datenGesamt.stundenlohn
    || 15;

    datenGesamt.daten
    .forEach((monat,index)=>{

        const tbody =
        document.getElementById(
            "tbody"+index
        );

        monat.forEach(
        (eintrag,rowIndex)=>{

            tbody.insertAdjacentHTML(
                "beforeend",
                neueZeileHTML(
                    rowIndex+1
                )
            );

        });

    });

    eventsNeu();

    document
    .querySelectorAll(".monat")
    .forEach((monat,monatIndex)=>{

        monat
        .querySelectorAll("tbody tr")
        .forEach((row,rowIndex)=>{

            const daten =
            datenGesamt
            .daten[monatIndex]
            [rowIndex];

            row.querySelector(
            ".veranstaltung"
            ).value =
            daten.veranstaltung
            || "";

            row.querySelector(
            ".ort"
            ).value =
            daten.ort
            || "";

            row.querySelector(
            ".datum"
            ).value =
            daten.datum
            || "";

            row.querySelector(
            ".von"
            ).value =
            daten.von
            || "";

            row.querySelector(
            ".bis"
            ).value =
            daten.bis
            || "";

        });

    });

    berechnen();

}

/* ALLES LÖSCHEN */
window.allesLoeschen =
async function(){

    if(
        confirm(
            "Wirklich löschen?"
        )
    ){

        await set(

            ref(
                database,
                "users/"
                +window.currentUser.uid
                +"/gehalt2026"
            ),

            null

        );

        location.reload();

    }

}

</script>

</body>
</html>
