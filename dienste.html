<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dienste</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#111;
  color:white;
  padding:20px;
}

h1{
  text-align:center;
  font-size:48px;
  margin-bottom:30px;
}

.top-bar{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-bottom:30px;
  flex-wrap:wrap;
}

.admin-btn{
  background:#2563eb;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:12px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  text-decoration:none;
}

.delete-btn{
  background:#dc2626;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:25px;
  max-width:1400px;
  margin:auto;
}

/* MOBILE */
@media(max-width:1000px){
  .grid{
    grid-template-columns:1fr;
  }

  .card{
    flex-direction:column;
  }

  .card-actions{
    width:100%;
    align-items:stretch;
  }
}

/* CARD */
.card{
  background:#1c1c1f;
  border-radius:22px;
  padding:25px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:30px;
  position:relative;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.01);
}

/* LINKER INHALT */
.card-main{
  flex:1;
}

.card h2{
  font-size:32px;
  margin-bottom:20px;
  color:white;
}

/* SAUBERE ZEILEN */
.info-row{
  display:flex;
  align-items:flex-start;
  margin-bottom:12px;
  gap:15px;
}

.info-label{
  min-width:190px;
  font-weight:bold;
  color:white;
  font-size:17px;
}

.info-value{
  flex:1;
  color:#d1d5db;
  font-size:17px;
  line-height:1.5;
}

/* BUTTON RECHTS */
.card-actions{
  display:flex;
  flex-direction:column;
  gap:12px;
  min-width:180px;
}

.card-actions .admin-btn{
  width:100%;
  text-align:center;
}

/* DELETE */
.remove-btn{
  position:absolute;
  top:12px;
  right:12px;
  background:#dc2626;
  color:white;
  border:none;
  border-radius:8px;
  padding:6px 10px;
  cursor:pointer;
  font-weight:bold;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-content{
  background:#1c1c1f;
  padding:25px;
  border-radius:20px;
  width:90%;
  max-width:500px;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid #444;
  background:#111;
  color:white;
}

.button-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
</style>
</head>

<body>

<h1>Dienste</h1>

<div class="top-bar">
  <a href="startseite.html" class="admin-btn">Zurück</a>
  <button class="admin-btn" onclick="oeffne()">+ Dienst hinzufügen</button>
</div>

<div class="grid" id="container"></div>

<!-- MODAL -->
<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <input type="date" id="datum">
    <input type="time" id="von">
    <input type="time" id="bis">
    <input id="ort" placeholder="Veranstaltungsort">
    <input id="art" placeholder="Veranstaltungsart">
    <input id="auftraggeber" placeholder="Auftraggeber">
    <input id="verantwortlich" placeholder="Verantwortlicher vor Ort">
    <input id="personal" type="number" placeholder="Benötigtes Personal">

    <div class="button-row">
      <button class="admin-btn" onclick="speichern()">Speichern</button>
      <button class="admin-btn" onclick="fertig()">Fertig</button>
      <button class="admin-btn delete-btn" onclick="schliessen()">Abbrechen</button>
    </div>
  </div>
</div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import {
  getDatabase,
  ref,
  push,
  onValue,
  remove,
  update
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBiKHmV0HEBB2Gr74VOgbosxRGs9MDa7uQ",
  authDomain: "nksp-app.firebaseapp.com",
  databaseURL: "https://nksp-app-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "nksp-app",
  storageBucket: "nksp-app.firebasestorage.app",
  messagingSenderId: "328702502215",
  appId: "1:328702502215:web:080148f3e768bfafc29862"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const diensteRef = ref(db, "dienste");

let liste = [];
let userRolle = "";
let bearbeiteID = null;

/* =========================
   LOGIN + ROLLE
========================= */
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }

  onValue(ref(db, "benutzer"), (snapshot) => {
    let gefunden = false;

    snapshot.forEach((child) => {
      const daten = child.val();

      if (daten.uid === user.uid) {
        gefunden = true;
        userRolle = daten.rolle || "";

        /* Nur Admin darf hinzufügen */
        if (userRolle !== "admin") {
          const addBtn = document.querySelector(".top-bar button");
          if (addBtn) {
            addBtn.style.display = "none";
          }
        }

        render();
      }
    });

    if (!gefunden) {
      console.log("Benutzerrolle nicht gefunden");
    }

  }, { onlyOnce: true });
});

/* =========================
   MODAL
========================= */
window.oeffne = function () {
  if (userRolle !== "admin") {
    alert("Nur Admins dürfen Dienste hinzufügen");
    return;
  }

  bearbeiteID = null;

  document.getElementById("datum").value = "";
  document.getElementById("von").value = "";
  document.getElementById("bis").value = "";
  document.getElementById("ort").value = "";
  document.getElementById("art").value = "";
  document.getElementById("auftraggeber").value = "";
  document.getElementById("verantwortlich").value = "";
  document.getElementById("personal").value = "";

  document.getElementById("modal").style.display = "flex";
};

window.schliessen = function () {
  document.getElementById("modal").style.display = "none";
};

window.fertig = async function () {
  await window.speichern(true);
};
/* =========================
   FORMAT
========================= */
function formatDatum(datum) {
  if (!datum) return "-";

  const teile = datum.split("-");
  if (teile.length !== 3) return datum;

  return `${teile[2]}.${teile[1]}.${teile[0]}`;
}

function berechneDauer(von, bis) {
  if (!von || !bis) return "-";

  const [vh, vm] = von.split(":").map(Number);
  const [bh, bm] = bis.split(":").map(Number);

  let start = vh * 60 + vm;
  let ende = bh * 60 + bm;

  /* falls über Mitternacht */
  if (ende < start) {
    ende += 24 * 60;
  }

  const diff = ende - start;
  const stunden = Math.floor(diff / 60);
  const minuten = diff % 60;

  return `${stunden}h ${minuten}min`;
}

/* =========================
   ALTE DIENSTE LÖSCHEN
   Beispiel:
   14.04 → sichtbar bis 15.04 23:59
========================= */
async function alteDiensteEntfernen() {
  const jetzt = new Date();

  for (const dienst of liste) {
    if (!dienst.datum) continue;

    const loeschDatum = new Date(dienst.datum);

    /* +1 Tag */
    loeschDatum.setDate(loeschDatum.getDate() + 1);

    /* Ende des Folgetages */
    loeschDatum.setHours(23, 59, 59, 999);

    if (jetzt > loeschDatum) {
      try {
        await push(ref(db, "papierkorb"), {
          ...dienst,
          originalPfad: "dienste",
          autoGeloescht: true,
          geloeschtAm: Date.now()
        });

        await remove(ref(db, "dienste/" + dienst.id));

      } catch (error) {
        console.error("Auto-Löschen Fehler:", error);
      }
    }
  }
}

/* =========================
   SPEICHERN
========================= */
window.speichern = async function (schliessenNachSpeichern = false) {
  if (userRolle !== "admin") {
    zeigeMeldung("Nur Admins dürfen speichern.", "error");
    return;
  }

  const daten = {
    datum: document.getElementById("datum").value,
    von: document.getElementById("von").value,
    bis: document.getElementById("bis").value,
    ort: document.getElementById("ort").value || "",
    art: document.getElementById("art").value || "",
    auftraggeber: document.getElementById("auftraggeber").value || "",
    verantwortlich: document.getElementById("verantwortlich").value || "",
    personal: document.getElementById("personal").value || ""
  };

  if (!daten.datum || !daten.von || !daten.bis) {
    zeigeMeldung("Bitte Datum und Uhrzeit ausfüllen.", "error");
    return;
  }

  try {
    if (bearbeiteID) {
      await update(ref(db, "dienste/" + bearbeiteID), daten);

      zeigeMeldung(
        `Dienst am <strong>${formatDatum(daten.datum)}</strong> aktualisiert.`
      );

      if (schliessenNachSpeichern) {
        schliessen();
      }

      bearbeiteID = null;
      return;
    }

    await push(diensteRef, daten);

zeigeMeldung(
  `Dienst am <strong>${formatDatum(daten.datum)}</strong> erfolgreich gespeichert.`
);

if (schliessenNachSpeichern) {
  setTimeout(() => {
    window.schliessen();
    location.reload();
  }, 2000);
} else {
  document.getElementById("datum").value = "";
  document.getElementById("von").value = "";
  document.getElementById("bis").value = "";
  document.getElementById("ort").value = "";
  document.getElementById("art").value = "";
  document.getElementById("auftraggeber").value = "";
  document.getElementById("verantwortlich").value = "";
  document.getElementById("personal").value = "";
  document.getElementById("datum").focus();
}

  } catch (error) {
    console.error(error);
    zeigeMeldung("Fehler beim Speichern.", "error");
  }
};
/* =========================
   BEARBEITEN
========================= */
window.bearbeiten = function (i) {
  if (userRolle !== "admin") return;

  const x = liste[i];
  if (!x) return;

  bearbeiteID = x.id;

  document.getElementById("datum").value = x.datum || "";
  document.getElementById("von").value = x.von || "";
  document.getElementById("bis").value = x.bis || "";
  document.getElementById("ort").value = x.ort || "";
  document.getElementById("art").value = x.art || "";
  document.getElementById("auftraggeber").value = x.auftraggeber || "";
  document.getElementById("verantwortlich").value = x.verantwortlich || "";
  document.getElementById("personal").value = x.personal || "";

  document.getElementById("modal").style.display = "flex";
};

/* =========================
   LÖSCHEN
========================= */
window.loeschen = async function (i) {
  if (userRolle !== "admin") return;

  if (!confirm("Wirklich löschen?")) return;

  const eintrag = liste[i];
  if (!eintrag) return;

  try {
    await push(ref(db, "papierkorb"), {
      ...eintrag,
      originalPfad: "dienste",
      geloeschtAm: Date.now()
    });

    await remove(ref(db, "dienste/" + eintrag.id));

  } catch (error) {
    console.error(error);
    alert("Fehler beim Löschen");
  }
};

/* =========================
   ZUSAGEN / ABSAGEN
========================= */
function zeigeMeldung(text, typ = "success") {
  // Alte Meldung entfernen
  const alt = document.getElementById("toastMeldung");
  if (alt) alt.remove();

  const toast = document.createElement("div");
  toast.id = "toastMeldung";

  toast.style.position = "fixed";
  toast.style.top = "20px";
  toast.style.left = "50%";
  toast.style.transform = "translateX(-50%)";
  toast.style.padding = "14px 22px";
  toast.style.borderRadius = "12px";
  toast.style.fontSize = "16px";
  toast.style.fontWeight = "500";
  toast.style.color = "white";
  toast.style.zIndex = "9999";
  toast.style.boxShadow = "0 8px 25px rgba(0,0,0,0.35)";
  toast.style.transition = "opacity 0.3s ease";

  if (typ === "error") {
    toast.style.background = "#dc2626";
  } else {
    toast.style.background = "#16a34a";
  }

  toast.innerHTML = text;
  document.body.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = "0";
    setTimeout(() => toast.remove(), 300);
  }, 2000);
}
  
  window.antworten = async function (id, typ) {
  const user = auth.currentUser;
  if (!user) return;

  const dienst = liste.find(x => x.id === id);
  if (!dienst) return;

  const maxPersonal = Number(dienst.personal || 0);
  const aktuelleZusagen = dienst.zusagen
    ? Object.keys(dienst.zusagen).length
    : 0;

  if (
  typ === "zusagen" &&
  maxPersonal > 0 &&
  aktuelleZusagen >= maxPersonal
) {
  zeigeMeldung("Dieser Dienst ist <strong>vollständig besetzt</strong>.", "error");
  return;
}

  let name = "Unbekannt";

  await new Promise((resolve) => {
    onValue(ref(db, "benutzer"), (snapshot) => {
      snapshot.forEach((child) => {
        const daten = child.val();

        if (daten.uid === user.uid) {
          name = `${daten.vorname || ""} ${daten.nachname || ""}`;
        }
      });

      resolve();
    }, { onlyOnce: true });
  });

  await push(ref(db, `dienste/${id}/${typ}`), {
    uid: user.uid,
    name,
    zeit: Date.now()
  });

    const datum = formatDatum(dienst.datum);

if (typ === "zusagen") {
  zeigeMeldung(`Du hast <strong>zugesagt</strong> für den Dienst am ${datum}.`);
} else {
  zeigeMeldung(`Du hast <strong>abgesagt</strong> für den Dienst am ${datum}.`, "error");
}

};
    
  /* =========================
   RENDER
========================= */
function render() {
  const c = document.getElementById("container");
  if (!c) return;

  c.innerHTML = "";

  if (liste.length === 0) {
    c.innerHTML = `
      <div style="text-align:center; width:100%; padding:40px;">
        Keine Dienste vorhanden
      </div>
    `;
    return;
  }

  liste.forEach((x, i) => {
    const maxPersonal = Number(x.personal || 0);
    const aktuelleZusagen = x.zusagen
      ? Object.keys(x.zusagen).length
      : 0;

    const voll =
      maxPersonal > 0 &&
      aktuelleZusagen >= maxPersonal;

    c.innerHTML += `
      <div class="card">

        ${
          userRolle === "admin"
            ? `<button class="remove-btn" onclick="loeschen(${i})">X</button>`
            : ""
        }

        <div class="card-main">
          <h2>${formatDatum(x.datum)}</h2>

          <p><strong>Zeit:</strong>
          ${x.von || "-"} - ${x.bis || "-"}
          (${berechneDauer(x.von, x.bis)})
          </p>

          <p><strong>Ort:</strong> ${x.ort || "-"}</p>
          <p><strong>Art:</strong> ${x.art || "-"}</p>
          <p><strong>Auftraggeber:</strong> ${x.auftraggeber || "-"}</p>
          <p><strong>Ansprechpartner:</strong> ${x.verantwortlich || "-"}</p>
          <p><strong>Benötigtes Personal:</strong>
          ${aktuelleZusagen}/${maxPersonal || "-"}
          </p>
        </div>

        <div class="card-actions">
          <button
            class="admin-btn"
            onclick="antworten('${x.id}','zusagen')"
            ${voll ? "disabled style='opacity:0.5;cursor:not-allowed;'" : ""}
          >
            ✅ Zusagen
          </button>

          <button
            class="admin-btn"
            onclick="antworten('${x.id}','absagen')"
          >
            ❌ Absagen
          </button>

          ${
            userRolle === "admin"
              ? `<button class="admin-btn" onclick="bearbeiten(${i})">✏ Bearbeiten</button>`
              : ""
          }
        </div>

      </div>
    `;
  });
}

/* =========================
   LADEN
========================= */
onValue(diensteRef, async (snapshot) => {
  liste = [];

  snapshot.forEach((child) => {
    liste.push({
      id: child.key,
      ...child.val()
    });
  });

  /* Erst rendern damit sichtbar */
  render();

  /* Danach alte prüfen */
  await alteDiensteEntfernen();

  /* Neu laden ohne abgelaufene */
  const jetzt = new Date();

  liste = liste.filter((dienst) => {
    if (!dienst.datum) return true;

    const loeschDatum = new Date(dienst.datum);
    loeschDatum.setDate(loeschDatum.getDate() + 1);
    loeschDatum.setHours(23, 59, 59, 999);

    return jetzt <= loeschDatum;
  });

  liste.sort((a, b) => new Date(a.datum) - new Date(b.datum));

  render();
});
</script>
