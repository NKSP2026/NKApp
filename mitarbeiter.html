<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mitarbeiter Übersicht</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
  margin:0;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:30px;
  font-size:48px;
}

.top-bar{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-bottom:30px;
  flex-wrap:wrap;
}

.admin-btn{
  background:#2563eb;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:12px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  text-decoration:none;
}

.delete-btn{
  background:#dc2626;
}

.container{
  max-width:1200px;
  margin:auto;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:25px;
}

.card{
  background:#1c1c1f;
  border-radius:22px;
  padding:20px;
  display:flex;
  gap:20px;
  align-items:center;
  cursor:pointer;
  position:relative;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.02);
}

.card img{
  width:110px;
  height:140px;
  object-fit:cover;
  border-radius:16px;
  border:2px solid #444;
}

.card h2{
  margin-bottom:10px;
  font-size:32px;
}

.card p{
  color:#ccc;
  margin-bottom:8px;
  font-size:18px;
}

.remove-btn{
  position:absolute;
  top:10px;
  right:10px;
  background:#dc2626;
  color:white;
  border:none;
  border-radius:8px;
  padding:5px 8px;
  cursor:pointer;
}

.edit-btn{
  position:absolute;
  top:10px;
  right:55px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:8px;
  padding:5px 10px;
  cursor:pointer;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-content{
  background:#f5f5f5;
  color:#333;
  width:90%;
  max-width:700px;
  border-radius:25px;
  position:relative;
  max-height:90vh;
  overflow-y:auto;
  padding-top:70px;
}

.modal-content img{
  width:140px;
  height:180px;
  object-fit:cover;
  border-radius:16px;
  border:2px solid #444;
  margin:20px;
  display:block;
}

.details{
  padding:25px;
}

.details h2{
  margin-bottom:20px;
  font-size:32px;
}

.details p{
  margin-bottom:12px;
  font-size:18px;
}

.close{
  position:absolute;
  top:10px;
  right:20px;
  font-size:34px;
  color:black;
  cursor:pointer;
}

.form-modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.form-content{
  background:#1c1c1f;
  width:90%;
  max-width:700px;
  border-radius:20px;
  padding:25px;
  max-height:90vh;
  overflow-y:auto;
}

.form-content input,
.form-content select{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid #444;
  background:#111;
  color:white;
  font-size:15px;
}

.form-content label{
  display:block;
  margin-top:12px;
  margin-bottom:8px;
  font-weight:bold;
}

.checkbox-box{
  background:#111;
  border:1px solid #444;
  border-radius:12px;
  padding:12px;
  margin-bottom:14px;
}

.checkbox-box label{
  display:block;
  margin-bottom:8px;
  font-weight:normal;
}

.checkbox-box input[type="checkbox"]{
  width:auto;
  margin-right:10px;
}

@media(max-width:800px){

  .grid{
    grid-template-columns:1fr;
  }

  h1{
    font-size:34px;
  }

  .card{
    flex-direction:column;
    text-align:center;
  }

}

</style>
</head>

<body>

<h1>Mitarbeiter Übersicht</h1>

<div class="top-bar">

  <a href="startseite.html" class="admin-btn">
    Zurück
  </a>

  <button
    class="admin-btn"
    id="addMitarbeiterBtn"
    onclick="oeffneFormular()"
  >
    + Mitarbeiter hinzufügen
  </button>

</div>

<div class="container">
  <div class="grid" id="mitarbeiterContainer"></div>
</div>

<!-- DETAILS -->
<div class="modal" id="detailModal">

  <div class="modal-content">

    <button
      class="admin-btn"
      style="position:absolute;top:15px;left:15px;"
      onclick="closeModal()"
    >
      Zurück
    </button>

    <span class="close" onclick="closeModal()">
      &times;
    </span>

    <img id="detailBild" src="">

    <div class="details">

      <h2 id="detailName"></h2>

      <p><strong>Alter:</strong> <span id="detailAlter"></span></p>
      <p><strong>bei NK angefangen:</strong> <span id="detailWannNK"></span></p>
      <p><strong>Geburtsdatum:</strong> <span id="detailGeburtsdatum"></span></p>
      <p><strong>Funktion:</strong> <span id="detailFunktion"></span></p>
      <p><strong>Beruf:</strong> <span id="detailBeruf"></span></p>
      <p><strong>Ausbildung:</strong> <span id="detailAusbildung"></span></p>
      <p><strong>Sicherheitsdienst:</strong> <span id="detailSicherheit"></span></p>
      <p><strong>Ersthelfer/in:</strong> <span id="detailErsthelfer"></span></p>
      <p><strong>Brandschutzhelfer/in:</strong> <span id="detailBrandschutz"></span></p>
      <p><strong>Datenschutzbeauftragter/in:</strong> <span id="detailDatenschutz"></span></p>
      <p><strong>Detektivschein:</strong> <span id="detailDetektivschein"></span></p>
      <p><strong>Funktion innerhalb der Firma:</strong> <span id="detailFirma"></span></p>
      <p><strong>Führerschein:</strong> <span id="detailFuehrerschein"></span></p>
      <p><strong>Vorgesetzter:</strong> <span id="detailChef"></span></p>

    </div>

  </div>

</div>

<!-- FORMULAR -->
<div class="form-modal" id="formularModal">

  <div class="form-content">

    <h2 id="formularTitel">
      Neuen Mitarbeiter anlegen
    </h2>

    <input type="text" id="formName" placeholder="Name">

    <input type="text" id="formGeburtsdatum" placeholder="Geburtsdatum">

    <input type="text" id="formWannNK" placeholder="bei NK angefangen">

    <input type="text" id="formFunktion" placeholder="Funktion">

    <input type="text" id="formBeruf" placeholder="Beruf">

    <input type="text" id="formAusbildung" placeholder="Ausbildung">

    <!-- SICHERHEIT -->
    <label>Sicherheitsdienst</label>

    <input
      type="text"
      id="formSicherheit"
      placeholder="Ausgewählte Qualifikationen"
    >

    <div class="checkbox-box">

      <label><input type="checkbox" class="sicherheitCheck" value="Unterrichtung 34a"> Unterrichtung §34a</label>

      <label><input type="checkbox" class="sicherheitCheck" value="Sachkunde 34a geprüft"> Sachkunde §34a geprüft</label>

      <label><input type="checkbox" class="sicherheitCheck" value="Servicekraft für Schutz und Sicherheit"> Servicekraft für Schutz und Sicherheit</label>

      <label><input type="checkbox" class="sicherheitCheck" value="Fachkraft für Schutz und Sicherheit"> Fachkraft für Schutz und Sicherheit</label>

      <label><input type="checkbox" class="sicherheitCheck" value="Geprüfte Schutz- und Sicherheitskraft"> Geprüfte Schutz- und Sicherheitskraft</label>

      <label><input type="checkbox" class="sicherheitCheck" value="Meister für Schutz und Sicherheit"> Meister für Schutz und Sicherheit</label>
    
    </div>

    <!-- ERSTHELFER -->
    <label>Ersthelfer/in</label>

    <input
      type="text"
      id="formErsthelfer"
      placeholder="Ausgewählte Qualifikationen"
    >

    <div class="checkbox-box">

      <label><input type="checkbox" class="ersthelferCheck" value="KFZ Ersthelfer"> KFZ Ersthelfer</label>

      <label><input type="checkbox" class="ersthelferCheck" value="Rettungshelfer"> Rettungshelfer</label>

      <label><input type="checkbox" class="ersthelferCheck" value="Rettungssanitäter"> Rettungssanitäter</label>

      <label><input type="checkbox" class="ersthelferCheck" value="Notfallsanitäter"> Notfallsanitäter</label>

    <!-- BRANDSCHUTZ -->
    <label>Brandschutzhelfer/in</label>

    <input

      <option>Ja</option>

    <input
      type="text"
      id="formDatenschutzText"
      placeholder="Zusätzliche Angaben"
    >

    <!-- DETEKTIV -->
    <label>Detektivschein</label>

    <select id="formDetektivschein">
      <option>Nein</option>
      <option>Ja</option>
    </select>

    <input
      type="text"
      id="formDetektivscheinText"
      placeholder="Zusätzliche Angaben"
    >

      type="text"
      id="formFirma"

    <label>Führerschein</label>

      type="text"
      id="formFuehrerschein"

    >

    <div class="checkbox-box">

      <label><input type="checkbox" class="fuehrerscheinCheck" value="A"> A</label>

      <label><input type="checkbox" class="fuehrerscheinCheck" value="B"> B</label>

      <label><input type="checkbox" class="fuehrerscheinCheck" value="C1"> C1</label>

      <label><input type="checkbox" class="fuehrerscheinCheck" value="C"> C</label>

      <label><input type="checkbox" class="fuehrerscheinCheck" value="D"> D</label>

      <label><input type="checkbox" class="fuehrerscheinCheck" value="D1"> D1</label>

      <label><input type="checkbox" class="fuehrerscheinCheck" value="BE"> BE</label>

      <label><input type="checkbox" class="fuehrerscheinCheck" value="CE"> CE</label>

      <label><input type="checkbox" class="fuehrerscheinCheck" value="L"> L</label>

      <label><input type="checkbox" class="fuehrerscheinCheck" value="T"> T</label>

    </div>

    <!-- CHEF -->
    <label>Vorgesetzter</label>

    <input
      type="text"
      id="formChef"
      placeholder="Ausgewählte Vorgesetzte"
    >

    <div class="checkbox-box">

      <label><input type="checkbox" class="chefCheck" value="Nicole Küttner"> Nicole Küttner</label>

      <label><input type="checkbox" class="chefCheck" value="Marcel Maczeyzik"> Marcel Maczeyzik</label>

    </div>

    <input type="file" id="formBild" accept="image/*">

    <button class="admin-btn" onclick="speichereMitarbeiter()">
      Speichern
    </button>

    <button
      class="admin-btn delete-btn"
      onclick="schliesseFormular()"

      Abbrechen
    </button>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  onValue,
  remove,
  update
}
from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

import {
  getStorage,
  ref as storageRef,
  uploadBytes,
  getDownloadURL
}
from "https://www.gstatic.com/firebasejs/12.11.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyBiKHmV0HEBB2Gr74VOgbosxRGs9MDa7uQ",
  authDomain: "nksp-app.firebaseapp.com",
  databaseURL: "https://nksp-app-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "nksp-app",
  storageBucket: "nksp-app.firebasestorage.app",
  messagingSenderId: "328702502215",
  appId: "1:328702502215:web:080148f3e768bfafc29862"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);
const auth = getAuth(app);
const storage = getStorage(app);

const mitarbeiterRef = ref(db, "mitarbeiter");
const benutzerRef = ref(db, "benutzer");

let mitarbeiterListe = [];
let userRolle = "";
let bearbeiteID = null;
let aktuellesBild = "";

/* ===================================================== */
/* CHECKBOX TEXT */
/* ===================================================== */

function updateCheckboxText(checkboxClass, textfeldId){

  const checked = Array.from(
    document.querySelectorAll("." + checkboxClass + ":checked")
  ).map(cb => cb.value);

  document.getElementById(textfeldId).value =
    checked.join(", ");

}

document.addEventListener("change", (e) => {

  if(e.target.classList.contains("sicherheitCheck")){
    updateCheckboxText("sicherheitCheck","formSicherheit");
  }

  if(e.target.classList.contains("ersthelferCheck")){
    updateCheckboxText("ersthelferCheck","formErsthelfer");
  }

  if(e.target.classList.contains("fuehrerscheinCheck")){
    updateCheckboxText("fuehrerscheinCheck","formFuehrerschein");
  }

  if(e.target.classList.contains("chefCheck")){
    updateCheckboxText("chefCheck","formChef");
  }

});

/* ===================================================== */
/* LOGIN */
/* ===================================================== */

onAuthStateChanged(auth, (user) => {

  if(!user){
    window.location.href = "index.html";
    return;
  }

  onValue(benutzerRef, (snapshot) => {

    snapshot.forEach((child) => {

      const daten = child.val();

      if(daten.uid === user.uid){

        userRolle =
          String(daten.rolle || "")
          .trim()
          .toLowerCase();

        console.log("ROLLE:", userRolle);

        if(userRolle !== "admin"){

          document.getElementById(
            "addMitarbeiterBtn"
          ).style.display = "none";

        }

        renderMitarbeiter();

      }

    });

  });

});

/* ===================================================== */
/* ALTER */
/* ===================================================== */

function berechneAlter(geburtsdatum){

  if(!geburtsdatum || !geburtsdatum.includes(".")){
    return "?";
  }

  const teile = geburtsdatum.split(".");

  const geburt = new Date(
    teile[2],
    teile[1]-1,
    teile[0]
  );

  const heute = new Date();

  let alter =
    heute.getFullYear() -
    geburt.getFullYear();

  if(
    heute.getMonth() < geburt.getMonth() ||
    (
      heute.getMonth() === geburt.getMonth() &&
      heute.getDate() < geburt.getDate()
    )
  ){
    alter--;
  }

  return alter;

}

/* ===================================================== */
/* RENDER */
/* ===================================================== */

function renderMitarbeiter(){

  const container =
    document.getElementById("mitarbeiterContainer");

  container.innerHTML = "";

  mitarbeiterListe.forEach((m,index) => {

    let adminButtons = "";

    if(userRolle === "admin"){

      adminButtons = `

        <button
          class="remove-btn"
          onclick="event.stopPropagation(); loescheMitarbeiter(${index})"
        >
          X
        </button>

        <button
          class="edit-btn"
          onclick="event.stopPropagation(); bearbeiteMitarbeiter(${index})"
        >
          ✏
        </button>

      `;

    }

    container.innerHTML += `

      <div
        class="card"
        onclick="showDetails(${index})"
      >

        ${adminButtons}

        <img src="${m.bild || ""}">

        <div>

          <h2>${m.name || ""}</h2>

          <p>
            ${berechneAlter(m.geburtsdatum)} Jahre
          </p>

          <p>
            ${m.funktion || ""}
          </p>

        </div>

      </div>

    `;

  });

}

/* ===================================================== */
/* LADEN */
/* ===================================================== */

onValue(mitarbeiterRef, (snapshot) => {

  mitarbeiterListe = [];

  snapshot.forEach((child) => {

    mitarbeiterListe.push({
      id: child.key,
      ...child.val()
    });

  });

  renderMitarbeiter();

});

/* ===================================================== */
/* DETAILS */
/* ===================================================== */

window.showDetails = function(index){

  const m = mitarbeiterListe[index];

  document.getElementById("detailBild").src =
    m.bild || "";

  document.getElementById("detailName").innerText =
    m.name || "";

  document.getElementById("detailAlter").innerText =
    berechneAlter(m.geburtsdatum);

  document.getElementById("detailWannNK").innerText =
    m.wannNK || "";

  document.getElementById("detailGeburtsdatum").innerText =
    m.geburtsdatum || "";

  document.getElementById("detailFunktion").innerText =
    m.funktion || "";

  document.getElementById("detailBeruf").innerText =
    m.beruf || "";

  document.getElementById("detailAusbildung").innerText =
    m.ausbildung || "";

  document.getElementById("detailSicherheit").innerText =
    m.sicherheit || "";

  document.getElementById("detailErsthelfer").innerText =
    m.ersthelfer || "";

  document.getElementById("detailBrandschutz").innerText =
    m.brandschutz || "";

  document.getElementById("detailDatenschutz").innerText =
    m.datenschutz || "";

  document.getElementById("detailDetektivschein").innerText =
    m.detektivschein || "";

  document.getElementById("detailFirma").innerText =
    m.firma || "";

  document.getElementById("detailFuehrerschein").innerText =
    m.fuehrerschein || "";

  document.getElementById("detailChef").innerText =
    m.chef || "";

  document.getElementById("detailModal").style.display =
    "flex";

};

window.closeModal = function(){

  document.getElementById("detailModal").style.display =
    "none";

};

/* ===================================================== */
/* FORMULAR */
/* ===================================================== */

window.oeffneFormular = function(){

  bearbeiteID = null;
  aktuellesBild = "";

  document.getElementById("formularTitel").innerText =
    "Neuen Mitarbeiter anlegen";

  document.getElementById("formName").value = "";
  document.getElementById("formGeburtsdatum").value = "";
  document.getElementById("formWannNK").value = "";
  document.getElementById("formFunktion").value = "";
  document.getElementById("formBeruf").value = "";
  document.getElementById("formAusbildung").value = "";
  document.getElementById("formSicherheit").value = "";
  document.getElementById("formErsthelfer").value = "";
  document.getElementById("formBrandschutzText").value = "";
  document.getElementById("formDatenschutzText").value = "";
  document.getElementById("formDetektivscheinText").value = "";
  document.getElementById("formFirma").value = "";
  document.getElementById("formFuehrerschein").value = "";
  document.getElementById("formChef").value = "";
  document.getElementById("formBild").value = "";

  document.querySelectorAll("input[type='checkbox']")
    .forEach(cb => cb.checked = false);

  document.getElementById("formularModal").style.display =
    "flex";

};

window.schliesseFormular = function(){

  document.getElementById("formularModal").style.display =
    "none";

};

/* ===================================================== */
/* BEARBEITEN */
/* ===================================================== */

window.bearbeiteMitarbeiter = function(index){

  const m = mitarbeiterListe[index];

  bearbeiteID = m.id;
  aktuellesBild = m.bild || "";

  document.getElementById("formularTitel").innerText =
    "Mitarbeiter bearbeiten";

  document.getElementById("formName").value =
    m.name || "";

  document.getElementById("formGeburtsdatum").value =
    m.geburtsdatum || "";

  document.getElementById("formWannNK").value =
    m.wannNK || "";

  document.getElementById("formFunktion").value =
    m.funktion || "";

  document.getElementById("formBeruf").value =
    m.beruf || "";

  document.getElementById("formAusbildung").value =
    m.ausbildung || "";

  document.getElementById("formSicherheit").value =
    m.sicherheit || "";

  document.getElementById("formErsthelfer").value =
    m.ersthelfer || "";

  document.getElementById("formBrandschutzText").value =
    m.brandschutz || "";

  document.getElementById("formDatenschutzText").value =
    m.datenschutz || "";

  document.getElementById("formDetektivscheinText").value =
    m.detektivschein || "";

  document.getElementById("formFirma").value =
    m.firma || "";

  document.getElementById("formFuehrerschein").value =
    m.fuehrerschein || "";

  document.getElementById("formChef").value =
    m.chef || "";

  document.getElementById("formularModal").style.display =
    "flex";

};

/* ===================================================== */
/* SPEICHERN */
/* ===================================================== */

window.speichereMitarbeiter = async function(){

  try{

    let bildURL = aktuellesBild;

    const file =
      document.getElementById("formBild").files[0];

    if(file){

      const bildRef = storageRef(
        storage,
        "mitarbeiterbilder/" +
        Date.now() +
        "_" +
        file.name
      );

      await uploadBytes(bildRef,file);

      bildURL = await getDownloadURL(bildRef);

    }

    const daten = {

      name:
        document.getElementById("formName").value || "",

      geburtsdatum:
        document.getElementById("formGeburtsdatum").value || "",

      wannNK:
        document.getElementById("formWannNK").value || "",

      funktion:
        document.getElementById("formFunktion").value || "",

      beruf:
        document.getElementById("formBeruf").value || "",

      ausbildung:
        document.getElementById("formAusbildung").value || "",

      sicherheit:
        document.getElementById("formSicherheit").value || "",

      ersthelfer:
        document.getElementById("formErsthelfer").value || "",

      brandschutz:
        document.getElementById("formBrandschutz").value +
        " " +
        document.getElementById("formBrandschutzText").value,

      datenschutz:
        document.getElementById("formDatenschutz").value +
        " " +
        document.getElementById("formDatenschutzText").value,

      detektivschein:
        document.getElementById("formDetektivschein").value +
        " " +
        document.getElementById("formDetektivscheinText").value,

      firma:
        document.getElementById("formFirma").value || "",

      fuehrerschein:
        document.getElementById("formFuehrerschein").value || "",

      chef:
        document.getElementById("formChef").value || "",

      bild:
        bildURL

    };

    /* UPDATE */

    if(bearbeiteID){

      await update(
        ref(db, "mitarbeiter/" + bearbeiteID),
        daten
      );

      alert("Mitarbeiter aktualisiert");

    }else{

      await push(
        mitarbeiterRef,
        daten
      );

      alert("Mitarbeiter gespeichert");

    }

    schliesseFormular();

  }catch(error){

    console.error(error);

    alert("Fehler beim Speichern");

  }

};

window.loescheMitarbeiter = async function(index){

  const ok =
    confirm("Wirklich löschen?");

  if(!ok) return;

  try{

    await remove(
      ref(
        db,
        "mitarbeiter/" +
        mitarbeiterListe[index].id
      )
    );

    alert("Mitarbeiter gelöscht");

  }catch(error){

    console.error(error);

    alert("Fehler beim Löschen");

  }

};
